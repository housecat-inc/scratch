root = "."
tmp_dir = "tmp/app"

[build]
  cmd = "go build -o ./tmp/app/app ./cmd/app"
  entrypoint = ["./tmp/app/app"]
  delay = 200
  exclude_dir = ["tmp"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[misc]
  clean_on_exit = true
