root = "."
tmp_dir = "tmp/app"

[build]
  cmd = "go generate ./pkg/db/... ./pkg/ui/... ./uikit/... && go build -o ./tmp/app/app ./cmd/app"
  entrypoint = ["./tmp/app/app"]
  delay = 200
  exclude_dir = ["pkg/db/internal", "tmp"]
  exclude_regex = ["_templ\\.go$", "_test\\.go$"]
  include_ext = ["go", "html", "sql", "templ"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[misc]
  clean_on_exit = true
