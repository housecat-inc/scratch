root = "."
tmp_dir = "tmp"

[build]
  cmd = "go generate ./pkg/db/... ./pkg/ui/... ./uikit/... && go generate ./pkg/api/... && go build -o ./tmp/scratch ./cmd/scratch"
  entrypoint = ["./tmp/scratch"]
  delay = 200
  exclude_dir = ["pkg/db/internal", "tmp"]
  exclude_regex = ["_templ\\.go$", "_test\\.go$"]
  include_ext = ["css", "go", "html", "js", "sql", "templ"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[misc]
  clean_on_exit = true
